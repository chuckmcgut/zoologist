# Zoologist example configuration. Copy to config/zoologist.toml and edit.
# Check it with:  zoologist check-config --config config/zoologist.toml

[station]
name = "Home"
timezone = "America/New_York"
country = "USA"            # ISO-3166 alpha-3, used by the SpeciesNet geofence
admin1_region = "NY"       # state/province, optional

[server]
bind = "0.0.0.0:8090"
data_dir = "/data"
# static_dir = "/custom-ui"   # only to serve a customised dashboard; the built-in one is used otherwise
cors_allow_origins = ["*"]

[video]
decoder = "rust"           # "rust" | "ffmpeg"  (chosen in plan Step 0.4)
ffmpeg_path = "ffmpeg"     # only used when decoder = "ffmpeg"
analysis_max_width = 1536  # frames wider than this are scaled down for analysis; wider finds
                           # smaller/distant animals (the detector's cost barely changes)

[inference]
detector = "md-sorrel"     # key into [models.*] (see docs/MODELS.md and docs/PERFORMANCE.md)
workers = 3                # detector threads (each ~1 core while busy)
queue_capacity = 12        # pending regions; the oldest is dropped when full
max_regions_per_frame = 2
keepalive_seconds = 2
idle_motion_seconds = 1    # wind or rain: motion all the time and nothing found. The detector then
                           # looks once in this many seconds until it finds something. 0 = every frame

# The same detector at 640: for `detector = "md-sorrel-640"` on a Reolink Hub (see there).
# [models.md-sorrel-640]
# path = "/models/md_v1000_sorrel_640.onnx"
# kind = "yolov8"
# classes = "megadetector"
# input_size = 640
# score_threshold = 0.35

[models.md-sorrel]
path = "/models/md_v1000_sorrel_320.onnx"
kind = "yolov8"            # yolov5 | yolov8 | yolo_e2e   (output layout, see docs/MODELS.md)
classes = "megadetector"   # megadetector | coco
input_size = 320
score_threshold = 0.35

# Faster (about 2x) but less accurate; use if the CPU cannot keep up.
[models.md-spruce]
path = "/models/md_v1000_spruce_320.onnx"
kind = "yolov5"
classes = "megadetector"
input_size = 320
score_threshold = 0.35

[species]
enabled = true
model = "speciesnet"       # speciesnet | bioclip
path = "/models/speciesnet.onnx"
labels = "/models/speciesnet_labels.txt"
taxonomy = "/models/speciesnet_taxonomy.txt"
geofence = "/models/speciesnet_geofence.json"
workers = 1
max_crops_per_event = 3
min_score = 0.65           # SpeciesNet's own threshold for naming a species or a group
still_unnamed_as_motion = true   # an "animal" that never moved and cannot be named is stored as
                                 # motion (a stump or a shadow the detector keeps seeing)
check_people = true        # a "person" the classifier finds nothing in (an insect in the
                           # infrared light, a gas cylinder) is stored as motion
snapshots = true           # live cameras behind a Reolink Home Hub: name animals from full-
                           # resolution snapshots of the main stream too (sharper than the sub)
learn_from_marks = true    # a still person or animal where you marked "nothing" before (a
                           # chair, a stump) is stored as motion
narrow_to_local = true     # a genus with one species that lives in your region is reported as
                           # that species ("Odocoileus species" in New York: white-tailed deer)
# Groups that mean one species where you live: when the classifier can only say "deer family" (or
# a genus in it), report this species. An animal it is sure of (a moose) keeps its own name.
# assume = { cervidae = "white-tailed deer" }
# bioclip only:
# species_list = "/config/my_species.txt"
# text_embeddings = "/models/bioclip_text_embeddings.f32"

[motion]
analysis_width = 320       # Y plane is downscaled to this width
threshold = 25             # per-pixel brightness difference (0-255)
contour_area = 0.002       # min changed fraction of the frame for one motion box
frame_alpha = 0.02         # background learning rate
lightning_fraction = 0.5   # >50% of pixels changed at once => reset, no motion
motion_event_min_seconds = 3
motion_event_cooldown_seconds = 120

[tracking]
min_hits = 3               # detections before a track becomes an event
max_missed_seconds = 5     # track ends after this long without a match
iou_match = 0.3
min_event_score = 0.55     # median score over the track
stationary_seconds = 60    # an object that stops moving for this long is "parked": its event
                           # ends and it starts no new events until it moves again (0 = off)
stationary_forget_minutes = 30   # how long a parked object is remembered once out of sight
min_movement = 0.2         # these labels only become events once they really move, by this
require_movement = ["vehicle"]   # share of their box's diagonal (0 = off): parked cars never do

[recording]
segment_seconds = 10
keep_segments_hours = 6
pre_capture_seconds = 5
post_capture_seconds = 5
max_event_minutes = 5      # longer events are split, so no clip is longer than this (0 = no limit)

[retention]
clips_days = 30
clips_max_total_mb = 100000

[[reolink_hubs]]
id = "home-hub"
# detector = "md-sorrel-640"     # this Hub's recordings get their own, larger detector (a [models.*]
                                 # key). About 4 times slower, which a recording can afford, and it
                                 # keeps hold of a small, distant animal. Live cameras are not affected.
url = "http://192.168.1.10"      # enable HTTP on the Hub; a pure-Rust build has no TLS client
user = "zoologist"               # a dedicated low-privilege Hub user with playback rights
password = "change-me"
poll_seconds = 30
lookback_minutes = 30            # on startup, import recordings this far back
analyse_stream = "sub"           # the H.264 sub recording is analysed and kept as the clip
                                 # (the main recording is often H.265, which browsers cannot play)
no_detection = "motion"          # "motion" = keep as a motion event | "discard"
clip_codec_fallback = "sub"      # reserved: main-stream clips are not implemented yet

# --- Reolink wired camera over HTTP-FLV (preferred for <= 5 MP) ---
[[cameras]]
id = "driveway"
name = "Driveway"
kind = "stream"
transport = "flv"                # "flv" | "rtsp"
detect_url = "http://192.168.1.20/flv?port=1935&app=bcs&stream=channel0_sub.bcs&user=USER&password=PASS"
record_url = "http://192.168.1.20/flv?port=1935&app=bcs&stream=channel0_main.bcs&user=USER&password=PASS"
# When detect_url and record_url are the same, the stream is opened once and used for both.
detect_fps = 5                   # frames above this rate are decoded but not analysed
record = true
labels = ["person", "vehicle", "animal", "motion"]   # drop "motion" for a view full of trees:
                                                     # sun and shadows make motion events all day
# motion_mask = [[0.0,0.0, 0.3,0.0, 0.3,0.08, 0.0,0.08]]   # e.g. the timestamp overlay
# warm_motion_only = true        # a thermal camera with a colour scale (blue/purple = cold, red to
                                 # yellow and white = hot): only something warm that moves is motion
# require_movement = []          # this camera's own tracking.require_movement. [] for a view of a
                                 # road where nothing parks: every vehicle seen is an event

# --- Reolink 4K/8MP wired camera over RTSP (main stream may be H.265) ---
[[cameras]]
id = "backyard"
name = "Backyard"
kind = "stream"
transport = "rtsp"
detect_url = "rtsp://USER:PASS@192.168.1.21:554/h264Preview_01_sub"   # newer firmware: Preview_01_sub
record_url = "rtsp://USER:PASS@192.168.1.21:554/h264Preview_01_main"
detect_fps = 5
record = true

# --- Wyze with RTSP firmware (wz_mini_hacks shown) or via docker-wyze-bridge ---
[[cameras]]
id = "garden-wyze"
name = "Garden (Wyze)"
kind = "stream"
transport = "rtsp"
detect_url = "rtsp://USER:PASS@192.168.1.30:8554/video2_unicast"      # SD
record_url = "rtsp://USER:PASS@192.168.1.30:8554/video1_unicast"      # HD
detect_fps = 5
record = true

# --- Always-on camera connected to the Home Hub: watched live through the Hub's RTSP ---
# `hub` puts the Hub's user and password into the URLs, so they are written only once.
# Channel 0 on the Hub is "01" in the path. Many Hub cameras send H.265 on the main stream,
# so record the H.264 sub stream.
[[cameras]]
id = "shed"
name = "Shed"
kind = "stream"
transport = "rtsp"
hub = "home-hub"
detect_url = "rtsp://192.168.1.10:554/h264Preview_01_sub"
record_url = "rtsp://192.168.1.10:554/h264Preview_01_sub"
# The live view gets a "Full resolution" button that opens the main stream (H.265 plays in Safari and
# Chromium browsers) only while someone watches. For a Reolink address ending in _sub that is the same
# address with _main; for other cameras, name it:
# full_url = "rtsp://192.168.1.10:554/h265Preview_01_main"
# full_rotate = 270   # degrees clockwise to show it upright; default: 270 for a stream taller than wide
#                     # (Reolink panorama cameras send their main stream on its side), else 0

# --- Reolink battery camera behind the Home Hub (no live stream) ---
[[cameras]]
id = "trail-argus"
name = "Trail (Argus)"
kind = "hub_clips"          # clicking it in the dashboard wakes it for a live view (2 minutes at a time)
hub = "home-hub"
channel = 0                      # Hub API channel number (0-based)
